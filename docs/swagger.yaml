basePath: /api/v1
definitions:
  dto.APIResponse:
    properties:
      data: {}
      message:
        example: success
        type: string
      success:
        example: true
        type: boolean
    type: object
  dto.AddCartRequest:
    properties:
      jumlah:
        example: 2
        type: integer
      obat_id:
        example: 0d744571-...
        type: string
    type: object
  dto.AdminRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    required:
    - email
    - name
    - password
    type: object
  dto.AuthResponse:
    properties:
      email:
        type: string
      name:
        example: Budi
        type: string
      role:
        example: user
        type: string
      token:
        example: jwt_token_here
        type: string
    type: object
  dto.CartItemResponse:
    properties:
      harga:
        type: number
      id:
        type: string
      jumlah:
        type: integer
      nama_obat:
        type: string
      obat_id:
        type: string
      subtotal:
        type: number
    type: object
  dto.CartResponse:
    properties:
      apotek_id:
        type: string
      items:
        items:
          $ref: '#/definitions/dto.CartItemResponse'
        type: array
      total:
        type: number
    type: object
  dto.ChangeAdminStatusRequest:
    properties:
      status:
        example: suspended
        type: string
    required:
    - status
    type: object
  dto.ChangePasswordRequest:
    properties:
      new_password:
        example: passwordBaru123
        minLength: 6
        type: string
      old_password:
        example: passwordLama123
        type: string
    required:
    - new_password
    - old_password
    type: object
  dto.ErrorResponse:
    properties:
      message:
        example: error message
        type: string
      success:
        example: false
        type: boolean
    type: object
  dto.ForgotPasswordRequest:
    properties:
      email:
        example: admin.apotek@gmail.com
        type: string
    required:
    - email
    type: object
  dto.GoogleLoginRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  dto.LoginRequest:
    properties:
      email:
        example: budi@email.com
        type: string
      password:
        example: password123
        type: string
    type: object
  dto.MetaPagination:
    properties:
      limit:
        example: 10
        type: integer
      page:
        example: 1
        type: integer
      total:
        example: 100
        type: integer
      total_page:
        example: 10
        type: integer
    type: object
  dto.ObatRequest:
    properties:
      harga:
        example: 5000
        type: number
      nama:
        example: Paracetamol
        type: string
      stok:
        example: 50
        type: integer
    type: object
  dto.PaginatedResepResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.ResepResponse'
        type: array
      meta:
        $ref: '#/definitions/dto.MetaPagination'
    type: object
  dto.PaymentNotification:
    properties:
      order_id:
        type: string
      payment_type:
        type: string
      signature_key:
        type: string
      transaction_status:
        type: string
    type: object
  dto.RegisterAdminRequest:
    properties:
      alamat:
        type: string
      deskripsi:
        type: string
      email:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      nama_apotek:
        type: string
      name:
        type: string
      password:
        minLength: 6
        type: string
      phone_number:
        type: string
      photo_url:
        type: string
    required:
    - alamat
    - email
    - latitude
    - longitude
    - nama_apotek
    - name
    - password
    - phone_number
    type: object
  dto.RegisterRequest:
    properties:
      email:
        example: budi@email.com
        type: string
      name:
        example: Budi
        type: string
      password:
        example: password123
        type: string
    type: object
  dto.ResepResponse:
    properties:
      file_url:
        type: string
      id:
        type: integer
      status:
        type: string
      transaksi_id:
        type: integer
    type: object
  dto.ResetPasswordRequest:
    properties:
      new_password:
        example: passwordBaru123
        minLength: 6
        type: string
      token:
        example: abc-123-xyz-token
        type: string
    required:
    - new_password
    - token
    type: object
  dto.UpdateApotekRequest:
    properties:
      alamat:
        example: Jl. Merdeka No. 45
        type: string
      deskripsi:
        example: Apotek buka setiap hari.
        type: string
      jam_buka:
        example: "08:00:00"
        type: string
      jam_tutup:
        example: "22:00:00"
        type: string
      latitude:
        example: -6.2
        type: number
      longitude:
        example: 106.816666
        type: number
      nama:
        example: Apotek Sehat Sejahtera
        type: string
      phone_number:
        example: "081234567890"
        type: string
      photo_url:
        example: https://example.com/photo.jpg
        type: string
    type: object
  dto.UpdateCartRequest:
    properties:
      jumlah:
        example: 3
        type: integer
    type: object
  dto.UpdateResepStatusRequest:
    properties:
      status:
        example: approved
        type: string
    required:
    - status
    type: object
  dto.VerifyAdminRequest:
    properties:
      action:
        example: approved
        type: string
      admin_id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      notes:
        example: Dokumen lengkap dan valid
        type: string
    required:
    - action
    - admin_id
    type: object
host: localhost:8080
info:
  contact:
    email: cs.medifinder@gmail.com
    name: API Support
  description: API untuk mencari apotek terdekat, reservasi obat, dan transaksi pembayaran
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Medifinder API
  version: "1.0"
paths:
  /admin/apotek:
    post:
      consumes:
      - multipart/form-data
      description: Membuat data apotek baru sekaligus upload foto profil
      parameters:
      - description: Nama Apotek
        in: formData
        name: nama
        required: true
        type: string
      - description: Alamat Lengkap
        in: formData
        name: alamat
        required: true
        type: string
      - description: Latitude
        in: formData
        name: latitude
        required: true
        type: number
      - description: Longitude
        in: formData
        name: longitude
        required: true
        type: number
      - description: Format HH:mm
        in: formData
        name: jam_buka
        type: string
      - description: Format HH:mm
        in: formData
        name: jam_tutup
        type: string
      - description: File Foto (.jpg, .png)
        in: formData
        name: photo
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: Tambah Apotek Baru
      tags:
      - Apotek
    put:
      consumes:
      - application/json
      description: Update informasi profil apotek termasuk jam operasional dan kontak
      parameters:
      - description: Data update apotek
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateApotekRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'message: profil apotek berhasil diupdate'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 'error: format data tidak valid / pesan error lainnya'
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update Profil Apotek Sendiri
      tags:
      - Apotek
  /admin/foto:
    put:
      consumes:
      - multipart/form-data
      description: Upload foto profil untuk apotek milik admin yang sedang login
      parameters:
      - description: File Foto Apotek (.jpg, .png)
        in: formData
        name: photo
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: Update Foto Apotek
      tags:
      - Apotek
  /admin/obat:
    get:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Lihat stok obat saya (Admin Only)
      tags:
      - Admin Obat
    post:
      consumes:
      - application/json
      description: Admin apotek menambahkan obat ke apotek miliknya
      parameters:
      - description: Data obat
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ObatRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Tambahkan obat baru
      tags:
      - Admin Obat
  /admin/obat/{id}:
    delete:
      description: Menghapus data obat milik admin apotek
      parameters:
      - description: Obat ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: obat deleted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: error message
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Hapus obat
      tags:
      - Admin Obat
    put:
      consumes:
      - application/json
      description: Update informasi nama, stok, atau harga obat oleh admin apotek
      parameters:
      - description: Obat ID
        in: path
        name: id
        required: true
        type: string
      - description: Data update obat
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ObatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'message: obat updated'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 'error: invalid input / error message'
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update data obat
      tags:
      - Admin Obat
  /admin/resep:
    get:
      description: Admin apotek melihat daftar resep yang diunggah user
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Limit data (max 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PaginatedResepResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Daftar resep
      tags:
      - Admin Resep
  /admin/resep/{id}:
    put:
      consumes:
      - application/json
      description: Admin apotek memverifikasi atau menolak resep
      parameters:
      - description: ID Resep
        in: path
        name: id
        required: true
        type: integer
      - description: Status resep
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateResepStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update status resep
      tags:
      - Admin Resep
  /admin/transaksi:
    get:
      responses: {}
      security:
      - BearerAuth: []
      summary: Riwayat transaksi masuk (Admin Apotek)
      tags:
      - Admin Transaksi
  /apotek:
    get:
      description: Mengambil data apotek yang dimiliki oleh admin yang sedang login
      produces:
      - application/json
      responses:
        "200":
          description: data apotek
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: apotek tidak ditemukan
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Lihat apotek milik admin
      tags:
      - Admin Apotek
  /apotek/{id}/obat:
    get:
      parameters:
      - description: Apotek ID
        in: path
        name: id
        required: true
        type: string
      - description: Search by Name
        in: query
        name: name
        type: string
      - description: Page
        in: query
        name: page
        type: integer
      - description: Limit
        in: query
        name: limit
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Lihat daftar obat di apotek tertentu (Public)
      tags:
      - Obat
  /apotek/nearby:
    get:
      consumes:
      - application/json
      description: Mengambil daftar apotek berdasarkan lokasi user (latitude & longitude)
      parameters:
      - description: Latitude user
        in: query
        name: lat
        required: true
        type: number
      - description: Longitude user
        in: query
        name: lng
        required: true
        type: number
      - description: Radius pencarian dalam km (default 5, max 50)
        in: query
        name: radius
        type: number
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Limit data
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: list apotek + pagination
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid parameter
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties: true
            type: object
      summary: Cari apotek terdekat
      tags:
      - Apotek
  /artikel:
    get:
      consumes:
      - application/json
      description: Mengambil daftar artikel kesehatan yang berstatus PUBLISHED (bisa
        dari Super Admin atau NewsAPI)
      parameters:
      - description: 'Nomor halaman (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Jumlah data per halaman (default: 10)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Berisi array of artikel
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Daftar Artikel Kesehatan
      tags:
      - Artikel
  /cart:
    get:
      description: Mengambil semua daftar obat yang ada di keranjang user saat ini
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CartResponse'
        "401":
          description: 'error: unauthorized'
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Lihat isi keranjang
      tags:
      - Keranjang
  /cart/checkout:
    post:
      consumes:
      - application/json
      description: Membuat transaksi baru dari item dalam keranjang dan mengembalikan
        token pembayaran
      produces:
      - application/json
      responses:
        "200":
          description: transaksi_id, snap_token, redirect_url
          schema:
            additionalProperties: true
            type: object
        "400":
          description: cart kosong / stok tidak cukup
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Checkout keranjang
      tags:
      - Keranjang
  /cart/items:
    post:
      consumes:
      - application/json
      parameters:
      - description: Data item keranjang
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AddCartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Tambah obat ke keranjang
      tags:
      - Keranjang
  /cart/items/{id}:
    delete:
      description: Menghapus satu item obat dari keranjang belanja
      parameters:
      - description: Cart Item ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: 'message: item deleted'
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Hapus item dari keranjang
      tags:
      - Keranjang
    put:
      consumes:
      - application/json
      parameters:
      - description: Cart Item ID
        in: path
        name: id
        required: true
        type: string
      - description: Data update quantity
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update jumlah item di keranjang
      tags:
      - Keranjang
  /change-password:
    post:
      consumes:
      - application/json
      description: Mengganti password admin yang sedang aktif (harus tahu password
        lama)
      parameters:
      - description: Password Lama dan Password Baru
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: Ganti Password (Login Required)
      tags:
      - Auth
  /forgot-password:
    post:
      consumes:
      - application/json
      description: Mengirimkan link/token ke email admin untuk melakukan reset password
      parameters:
      - description: Email Admin
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Request Reset Password
      tags:
      - Auth
  /google-login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Google token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.GoogleLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Login via Google
      tags:
      - Auth
  /login:
    post:
      consumes:
      - application/json
      description: Autentikasi user dan mengembalikan JWT token
      parameters:
      - description: Email & Password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: token, user info
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "400":
          description: invalid input
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: invalid credentials
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: internal error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Login user
      tags:
      - Auth
  /me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Ambil profil user yang sedang login
      tags:
      - Auth
  /payment/notify:
    post:
      consumes:
      - application/json
      description: Endpoint callback dari Midtrans untuk update status transaksi (tidak
        untuk publik)
      parameters:
      - description: Midtrans notification payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.PaymentNotification'
      produces:
      - application/json
      responses:
        "200":
          description: ok
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: invalid payload
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: invalid signature
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Webhook notifikasi pembayaran
      tags:
      - Payment
  /register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Register data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Registrasi user
      tags:
      - Auth
  /register-admin:
    post:
      consumes:
      - application/json
      description: Pendaftaran mandiri untuk Admin Apotek beserta data apoteknya
      parameters:
      - description: Data Registrasi Admin Apotek
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterAdminRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Registrasi Mandiri Admin Apotek
      tags:
      - Auth
  /resep:
    post:
      consumes:
      - multipart/form-data
      description: User mengunggah resep sebagai dokumen pendukung transaksi
      parameters:
      - description: File resep (max 5MB)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload resep dokter
      tags:
      - Resep
  /reset-password:
    post:
      consumes:
      - application/json
      description: Membuat password baru menggunakan token yang dikirimkan via email
      parameters:
      - description: Token dari Email & Password Baru
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Reset Password via Token
      tags:
      - Auth
  /superadmin/admin:
    get:
      responses: {}
      security:
      - BearerAuth: []
      summary: Daftar semua admin apotek
      tags:
      - SuperAdmin
    post:
      parameters:
      - description: Data admin
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AdminRequest'
      responses: {}
      security:
      - BearerAuth: []
      summary: Buat akun admin apotek baru
      tags:
      - SuperAdmin
  /superadmin/admin/{id}/status:
    patch:
      consumes:
      - application/json
      parameters:
      - description: ID Admin Apotek
        in: path
        name: id
        required: true
        type: string
      - description: 'Status baru: ''approved'' atau ''suspended'''
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ChangeAdminStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Ubah status admin apotek (Suspend / Activate)
      tags:
      - SuperAdmin
  /superadmin/artikel:
    post:
      consumes:
      - multipart/form-data
      description: Membuat artikel kesehatan baru secara manual. Mendukung upload
        gambar thumbnail.
      parameters:
      - description: Judul Artikel
        in: formData
        name: judul
        required: true
        type: string
      - description: Isi konten artikel
        in: formData
        name: konten
        required: true
        type: string
      - description: Kategori artikel
        in: formData
        name: kategori
        required: true
        type: string
      - description: Status (DRAFT / PUBLISHED)
        in: formData
        name: status
        required: true
        type: string
      - description: File gambar thumbnail artikel (opsional)
        in: formData
        name: thumbnail
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Pesan sukses
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Input tidak valid
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Buat Artikel Manual
      tags:
      - SuperAdmin Artikel
  /superadmin/artikel/{id}:
    delete:
      description: Menghapus artikel berdasarkan ID
      parameters:
      - description: ID Artikel
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Pesan sukses
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Hapus Artikel
      tags:
      - SuperAdmin Artikel
  /superadmin/artikel/fetch:
    post:
      description: Menjalankan fungsi background untuk menarik artikel kesehatan terbaru
        dari NewsAPI
      produces:
      - application/json
      responses:
        "200":
          description: Pesan sukses trigger berjalan
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Fetch Artikel NewsAPI
      tags:
      - SuperAdmin Artikel
  /superadmin/pengajuan:
    get:
      parameters:
      - default: 1
        description: Halaman (default 1)
        in: query
        name: page
        type: integer
      - default: 10
        description: Jumlah data per halaman (default 10)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Ambil daftar admin apotek yang masih pending (butuh verifikasi)
      tags:
      - SuperAdmin
  /superadmin/verifikasi:
    post:
      consumes:
      - application/json
      parameters:
      - description: 'Data Verifikasi (Action: approved/rejected)'
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.VerifyAdminRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Verifikasi pendaftaran admin apotek (Approve / Reject)
      tags:
      - SuperAdmin
  /transaksi:
    get:
      description: Mengambil daftar transaksi milik user yang sedang login
      parameters:
      - description: Filter status transaksi
        in: query
        name: status
        type: string
      - description: Page
        in: query
        name: page
        type: integer
      - description: Limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: data + pagination
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Riwayat transaksi user
      tags:
      - Transaksi
  /transaksi/{id}:
    get:
      parameters:
      - description: Transaksi ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Detail transaksi
      tags:
      - Transaksi
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
