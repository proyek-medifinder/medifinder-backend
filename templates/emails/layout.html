{{define "email"}}<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>{{template "title" .}} | MediFinder</title>
  <style>
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table { border-collapse: collapse; mso-table-lspace: 0; mso-table-rspace: 0; }
    a { color: #0f766e; }
    @media screen and (max-width: 600px) {
      .email-wrap { padding: 16px 12px !important; }
      .email-header, .email-content { padding: 24px !important; }
      .email-title { font-size: 25px !important; line-height: 33px !important; }
      .email-button { display: block !important; text-align: center !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;width:100%;background-color:#f1f5f4;color:#334155;font-family:Arial,Helvetica,sans-serif;">
  <div style="display:none;font-size:1px;line-height:1px;color:#f1f5f4;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">{{template "preheader" .}}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%;background-color:#f1f5f4;">
    <tr><td class="email-wrap" align="center" style="padding:40px 16px;">
      <!--[if mso]><table role="presentation" width="600"><tr><td><![endif]-->
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;background-color:#ffffff;border:1px solid #dce5e2;border-radius:20px;font-family:Arial,Helvetica,sans-serif;">
        <tr><td class="email-header" style="padding:28px 36px;background-color:#0f766e;border-radius:20px 20px 0 0;">
          <table role="presentation" cellpadding="0" cellspacing="0"><tr>
            <td align="center" style="width:38px;height:38px;background-color:#ffffff;border-radius:10px;color:#0f766e;font-size:28px;font-weight:bold;line-height:38px;">+</td>
            <td style="padding-left:12px;"><p style="margin:0;color:#ffffff;font-size:23px;font-weight:bold;letter-spacing:-0.5px;">MediFinder</p><p style="margin:4px 0 0;color:#ccfbf1;font-size:12px;line-height:18px;">Obat dan apotek di sekitar Anda</p></td>
          </tr></table>
        </td></tr>
        <tr><td class="email-content" style="padding:36px;font-size:15px;line-height:25px;">
          {{template "content" .}}
          <p style="margin:28px 0 0;color:#64748b;font-size:14px;line-height:23px;">Salam,<br><strong style="color:#0f766e;">Tim MediFinder</strong></p>
        </td></tr>
        <tr><td style="padding:20px 24px;border-top:1px solid #e2e8f0;background-color:#f8fafc;border-radius:0 0 20px 20px;text-align:center;">
          <p style="margin:0;color:#64748b;font-size:12px;line-height:20px;">Email otomatis terkait akun dan layanan MediFinder.</p>
          <p style="margin:4px 0 0;color:#64748b;font-size:12px;line-height:20px;">&copy; {{currentYear}} MediFinder. Semua hak dilindungi.</p>
        </td></tr>
      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td></tr>
  </table>
</body>
</html>{{end}}
